<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>소방시설 활용 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 역할 탭 + 본문. 관리자 화면은 편집기(좌)·속성(우) 2열, 현장카드는 한 손 조작용 1열 + 하단 고정 탭. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface2:#f6f8fb; --ink:#121821; --muted:#566273; --line:#d3dae4;
  --signal:#c4122f; --signal-ink:#ffffff; --amber:#b77900; --amber-bg:#fff4d6; --ok:#17804a; --ok-bg:#e3f5ea;
  --blue:#1f4fc2; --blue-bg:#e6edfb; --danger-bg:#fde7ea; --panel:#1b2433; --panel-ink:#f3f5f9;
  --g-alarm:#b77900; --g-ext:#c4122f; --g-act:#1f4fc2;
  --f-display:"Gothic A1","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --surface:#151b24; --surface2:#1b232f; --ink:#e7ebf1; --muted:#9aa6b6; --line:#2a3443;
  --signal:#ff4a5f; --signal-ink:#14080a; --amber:#ffc23d; --amber-bg:#2f2610; --ok:#45d18a; --ok-bg:#10291c;
  --blue:#7ea2ff; --blue-bg:#16213a; --danger-bg:#331217; --panel:#0a0e14; --panel-ink:#e7ebf1;
  --g-alarm:#d9a21f; --g-ext:#ff4a5f; --g-act:#6f97ff; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#151b24; --surface2:#1b232f; --ink:#e7ebf1; --muted:#9aa6b6; --line:#2a3443;
  --signal:#ff4a5f; --signal-ink:#14080a; --amber:#ffc23d; --amber-bg:#2f2610; --ok:#45d18a; --ok-bg:#10291c;
  --blue:#7ea2ff; --blue-bg:#16213a; --danger-bg:#331217; --panel:#0a0e14; --panel-ink:#e7ebf1;
  --g-alarm:#d9a21f; --g-ext:#ff4a5f; --g-act:#6f97ff; color-scheme:dark;}
/* 현장 고대비 모드: 연기·야간 전제의 단일 룩 */
.hc{--bg:#000; --surface:#0b0b0b; --surface2:#151515; --ink:#fff; --muted:#d0d0d0; --line:#5a5a5a;
  --signal:#ff3b4f; --signal-ink:#000; --amber:#ffd400; --amber-bg:#2a2300; --ok:#3dff8f; --ok-bg:#002a12;
  --blue:#7fb0ff; --blue-bg:#001a3a; --danger-bg:#3a0008; --g-alarm:#ffd400; --g-ext:#ff3b4f; --g-act:#7fb0ff; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.1rem;font-weight:800}
h4{font-size:1rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);color:var(--panel-ink);}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.brand .qr{width:26px;height:26px;border:2px solid currentColor;border-radius:3px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.brand .qr i{background:currentColor;border-radius:1px}.brand .qr i:nth-child(2n){opacity:.25}
.brand small{font-family:var(--f-body);font-weight:500;opacity:.7;font-size:.75rem}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tab{background:transparent;border:1px solid transparent;color:inherit;padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:.9rem;opacity:.78}
.tab:hover{opacity:1;border-color:rgba(255,255,255,.25)}
.tab[aria-current="true"]{opacity:1;background:var(--signal);color:#fff;border-color:var(--signal)}
.sess{font-size:.78rem;opacity:.8;display:flex;gap:8px;align-items:center}
.sess button{background:transparent;border:1px solid rgba(255,255,255,.3);color:inherit;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:.75rem}

main{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sect-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;justify-content:space-between}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--signal);color:var(--signal)}
.btn.sm{min-height:30px;padding:3px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pg{font-family:var(--f-mono);font-size:.75rem;font-weight:600;color:var(--blue);background:var(--blue-bg);border-radius:3px;padding:1px 6px;white-space:nowrap}
.pg.ext{color:var(--amber);background:var(--amber-bg)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.un{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.chip.bad{background:var(--danger-bg);color:var(--signal);border-color:transparent}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);background:var(--surface2);border-radius:var(--r);padding:8px 10px;color:var(--ink);font-weight:400;font-size:.95rem;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

/* facility glyph */
.fg{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:800;font-size:.66rem;letter-spacing:-.03em;flex:none;font-family:var(--f-body)}
.fg.alarm{background:var(--g-alarm);color:#000}.fg.ext{background:var(--g-ext)}.fg.act{background:var(--g-act)}
.fg.lg{width:44px;height:44px;font-size:.82rem}

/* warnings */
.warn-box{display:flex;gap:10px;border-radius:var(--r);padding:10px 12px;border:1px solid transparent;align-items:flex-start}
.warn-box b.k{font-family:var(--f-display);font-size:.8rem;white-space:nowrap;padding-top:1px}
.warn-box.danger{background:var(--danger-bg);border-color:var(--signal)}
.warn-box.danger b.k{color:var(--signal)}
.warn-box.caution{background:var(--amber-bg)}
.warn-box.caution b.k{color:var(--amber)}
.warn-box.info{background:var(--surface2);border-color:var(--line)}
.warn-box.info b.k{color:var(--muted)}
.warn-box div{min-width:0}

/* procedure */
.proc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.proc>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.proc>summary::-webkit-details-marker{display:none}
.proc>summary h4{flex:1;min-width:0}
.proc>summary::after{content:"+";font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.proc[open]>summary::after{content:"−"}
.proc .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.apply{font-size:.85rem;display:flex;gap:8px;flex-wrap:wrap}
.apply b{background:var(--panel);color:var(--panel-ink);font-size:.72rem;padding:1px 8px;border-radius:3px}
.sit{background:var(--amber-bg);border:1px solid var(--amber);border-radius:var(--r);padding:10px 12px}
.sit b{color:var(--amber);font-size:.85rem}
.sit ul{margin:4px 0 0;padding-left:18px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.steps>li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--line);align-items:start}
.steps>li:first-child{border-top:0}
.sn{font-family:var(--f-mono);font-size:.75rem;font-weight:700;background:var(--blue);color:#fff;border-radius:3px;padding:3px 8px;white-space:nowrap}
.hc .sn{color:#000}
.steps ul{margin:4px 0 0;padding-left:18px;color:var(--ink)}
.steps li>div{min-width:0}
.emer{border-left:4px solid var(--signal);padding:6px 12px;background:var(--surface2)}
.emer b{color:var(--signal);font-size:.85rem}
.emer ul{margin:4px 0 0;padding-left:18px}
.note{font-size:.85rem;color:var(--muted)}

/* layouts */
.mgr{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:980px){.mgr{grid-template-columns:minmax(0,1fr)}}
.subtabs{display:flex;gap:2px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.subtab{background:none;border:0;padding:8px 12px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.subtab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--signal)}

/* plan editor */
.toolbar{display:flex;flex-wrap:wrap;gap:4px}
.tool{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:4px 8px 4px 4px;cursor:pointer;font-size:.8rem;font-weight:600}
.tool[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface2)}
.tool .fg{width:24px;height:24px;font-size:.58rem}
.lmk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:4px;font-size:.6rem;font-weight:800;color:#fff;background:var(--panel)}
.planwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
svg.plan{display:block;width:100%;min-width:560px;height:auto;touch-action:none;user-select:none}
.field svg.plan{min-width:0}
svg.plan .room rect{fill:var(--surface2);stroke:var(--muted);stroke-width:2}
svg.plan .room text{fill:var(--muted);font-size:14px;font-weight:600;font-family:var(--f-body)}
svg.plan .gridl{stroke:var(--line);stroke-width:1}
svg.plan .mk{cursor:pointer}
svg.plan .mk text{font-family:var(--f-body);font-weight:800;pointer-events:none}
svg.plan .sel{stroke:var(--ink);stroke-width:3;fill:none;stroke-dasharray:5 4}
svg.plan .hl{fill:none;stroke:var(--signal);stroke-width:4}
@media (prefers-reduced-motion:no-preference){svg.plan .hl{animation:pulse 1.2s ease-in-out infinite}}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.2}}

table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th,table.t td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.tw{overflow-x:auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--panel);color:var(--panel-ink);padding:10px 16px;border-radius:var(--r);font-weight:600;z-index:50;max-width:calc(100% - 32px)}

/* field card */
.field{max-width:640px;margin:0 auto;font-size:17px}
.field .fhead{background:var(--panel);color:var(--panel-ink);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.field .fhead h2{font-size:1.4rem}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tile .k{font-size:.8rem;font-weight:800;letter-spacing:.04em;color:var(--muted)}
.tile .v{font-size:1.15rem;font-weight:700;line-height:1.4}
.tile.hz{border:2px solid var(--signal);background:var(--danger-bg)}
.tile.hz .k{color:var(--signal)}
.tile.hz ul{margin:0;padding-left:20px;font-weight:700}
.big{min-height:56px;font-size:1.05rem}
.call{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface2);flex-wrap:wrap}
.call .num{font-family:var(--f-mono);font-size:1.25rem;font-weight:700;user-select:all}
.presence{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pres{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:8px;background:var(--surface);cursor:pointer;text-align:left;min-height:52px}
.pres.no{opacity:.4;cursor:default;background:transparent}
.pres span{font-size:.85rem;font-weight:700;line-height:1.2}
.ftabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);display:flex;justify-content:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.ftabs button{flex:1;max-width:200px;min-height:54px;border:0;border-radius:var(--r);background:transparent;color:var(--panel-ink);font-weight:800;font-size:1rem;cursor:pointer;opacity:.75}
.ftabs button[aria-current="true"]{background:var(--signal);color:#fff;opacity:1}
.facrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;cursor:pointer;min-height:64px}
.facrow .meta{min-width:0;flex:1}
.facrow .meta b{display:block}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:140px;height:105px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.photos figure{margin:0;position:relative}
.photos figure button{position:absolute;top:4px;right:4px}

/* public */
.pub{max-width:480px;margin:6vh auto 0;display:flex;flex-direction:column;gap:16px}
.pub .alarm{background:var(--signal);color:#fff;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px}
.pub .alarm h2{font-size:1.5rem}

/* QR labels */
.labels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.qrl{background:#fff;color:#111;border:3px solid #c4122f;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.qrl .hd{background:#c4122f;color:#fff;font-weight:800;width:100%;padding:6px;border-radius:4px;font-family:var(--f-display)}
.qrl .qbox{width:168px;height:168px;display:grid;place-items:center}
.qrl .qbox img,.qrl .qbox canvas{width:168px!important;height:168px!important}
.qrl small{font-size:.72rem;color:#333}
@media print{.top,.subtabs,.noprint,.ftabs{display:none!important}main{padding:0}.labels{grid-template-columns:repeat(3,1fr)}}

.manual{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:800px){.manual{grid-template-columns:minmax(0,1fr)}}
.toc{display:flex;flex-direction:column;gap:2px;position:sticky;top:76px}
@media (max-width:800px){.toc{position:static;flex-direction:row;flex-wrap:wrap}}
.toc button{display:flex;gap:8px;align-items:center;border:1px solid transparent;background:none;border-radius:var(--r);padding:6px 8px;cursor:pointer;text-align:left;font-weight:600;font-size:.88rem}
.toc button[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.toc .fg{width:24px;height:24px;font-size:.58rem}
ol.sop{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ol.sop>li{display:grid;grid-template-columns:64px 1fr;gap:8px}
ol.sop>li>span{font-family:var(--f-mono);font-weight:700;color:var(--signal);font-size:.85rem}
ol.sop ul{margin:4px 0 0;padding-left:18px}
.checklist{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);padding:6px 0;flex-wrap:wrap}
.chk .q{flex:1;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 10px;cursor:pointer;font-weight:700;font-size:.8rem}
.seg button[aria-pressed="true"].o{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"].x{background:var(--signal);color:#fff}
.copybox{white-space:pre-wrap;font-family:var(--f-body);background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:.95rem;user-select:text}
.result{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.result[aria-current="true"]{border-color:var(--signal);box-shadow:inset 3px 0 0 var(--signal)}
.ops{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.ops{grid-template-columns:minmax(0,1fr)}}
.demo-flag{font-size:.75rem;font-weight:700;color:var(--amber);background:var(--amber-bg);padding:2px 8px;border-radius:3px}
@media (max-width:600px){
  .top{position:static}
  .brand small{display:none}
  .tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;margin-left:0}
  .tab{white-space:nowrap}
}
/* 교재 사진 썸네일·라이트박스·작동법 모달·끌어놓기 */
.tbwrap{display:flex;flex-direction:column;gap:6px}
.tbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tb{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface2);border-radius:4px;padding:4px;cursor:zoom-in}
.tb img{width:96px;height:132px;object-fit:cover;object-position:center 40%;border-radius:2px;display:block}
.tb span{font-family:var(--f-mono);font-size:.72rem;font-weight:700;color:var(--blue)}
.tb:hover{border-color:var(--blue)}
.howbox{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.howbox ul{margin:0;padding-left:18px}
.ov{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ov.lb{z-index:70;background:#0b0d10}
.ov-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);color:var(--panel-ink)}
.ov-body{overflow:auto;padding-inline:16px;padding-block:16px 40px;max-width:900px;width:100%;margin:0 auto}
.lb-img{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:12px}
.lb-img img{max-width:min(100%,1000px);height:auto;display:block}
.tool:not([data-tool="select"]):not([data-tool="room"]){touch-action:none;cursor:grab}
.dragghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-50%) scale(1.5);filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.planwrap.droppable{outline:2px dashed var(--blue);outline-offset:2px}
.planwrap.over{outline-color:var(--signal);outline-style:solid}

/* ---------- 공통 조각 ---------- */
function warnHTML(w) {
  const k = { danger: '생명안전', caution: '주의', info: '참고' }[w.lvl];
  return '<div class="warn-box ' + w.lvl + '"><b class="k">' + k + '</b><div>' + esc(w.t) + ' ' + srcTag(w.src) + '</div></div>';
}
function procHTML(p, open) {
  let h = '<details class="proc"' + (open ? ' open' : '') + '><summary><h4>' + esc(p.title) + '</h4>' + pg(p.page) + '</summary><div class="body">';
  if (p.apply) h += '<div class="apply"><b>적용</b><span>' + esc(p.apply) + '</span></div>';
  if (p.overview) h += '<p class="small">' + esc(p.overview) + '</p>';
  if (p.situation) h += '<div class="sit"><b>선착소방대 화재현장 대응 가능 상황</b><ul>' + p.situation.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></div>';
  h += '<ol class="steps">' + p.steps.map(s => '<li><span class="sn">' + esc(s.h) + '</span><div><b>' + esc(s.t) + '</b>' + (s.d ? '<ul>' + s.d.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '') + '</div></li>').join('') + '</ol>';
  if (p.emergency) h += '<div class="emer"><b>비상조치 사항</b><ul>' + p.emergency.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
  if (p.note) h += '<p class="note">※ ' + esc(p.note) + '</p>';
  h += thumbs(pagesOf(p.page), '교재 원문 · 사진·화살표는 원문에서 확인');
  return h + '</div></details>';
}
function sopHTML(f) {
  return '<ol class="sop">' + f.sop.map(s => '<li><span>' + esc(s[0]) + '</span><div>' + esc(s[1]) + (s[2].length ? '<ul>' + s[2].map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '') + '</div></li>').join('') + '</ol>';
}
function relevantProcs(f, form) {
  if (!form) return f.procedures;
  const tagged = f.procedures.filter(p => p.tag);
  if (!tagged.length) return f.procedures;
  return f.procedures.filter(p => !p.tag || form.indexOf(p.tag) > -1 || p.tag.indexOf(form) > -1);
}

/* ---------- 개황도 SVG ---------- */
const VW = 800, VH = 520;
function planSVG(b, fl, opt) {
  opt = opt || {};
  let g = '';
  if (!fl.bg && !opt.ro) { for (let x = 0; x <= VW; x += 40) g += '<line class="gridl" x1="' + x + '" y1="0" x2="' + x + '" y2="' + VH + '"/>'; for (let y = 0; y <= VH; y += 40) g += '<line class="gridl" x1="0" y1="' + y + '" x2="' + VW + '" y2="' + y + '"/>'; }
  let s = '<svg class="plan" id="plan" viewBox="0 0 ' + VW + ' ' + VH + '" role="img" aria-label="' + esc(b.name + ' ' + fl.name + ' 개황도') + '"><rect x="0" y="0" width="' + VW + '" height="' + VH + '" fill="var(--surface)"/>';
  if (fl.bg) s += '<image href="' + fl.bg + '" x="0" y="0" width="' + VW + '" height="' + VH + '" preserveAspectRatio="xMidYMid meet" opacity="' + (opt.ro ? 1 : .55) + '"/>';
  s += g;
  fl.rooms.forEach(r => {
    s += '<g class="room mk" data-kind="room" data-id="' + r.id + '"><rect x="' + r.x + '" y="' + r.y + '" width="' + r.w + '" height="' + r.h + '" rx="2"/><text x="' + (r.x + 8) + '" y="' + (r.y + 20) + '">' + esc(r.label) + '</text></g>';
    if (S.sel && S.sel.id === r.id && !opt.ro) s += '<rect class="sel" x="' + (r.x - 4) + '" y="' + (r.y - 4) + '" width="' + (r.w + 8) + '" height="' + (r.h + 8) + '"/>';
  });
  fl.marks.forEach(m => {
    const L = LANDMARKS[m.kind]; const fill = m.kind === 'entry' ? 'var(--ok)' : m.kind === 'control' ? 'var(--signal)' : 'var(--panel)';
    s += '<g class="mk" data-kind="mark" data-id="' + m.id + '"><rect x="' + (m.x - 18) + '" y="' + (m.y - 14) + '" width="36" height="28" rx="4" fill="' + fill + '"/><text x="' + m.x + '" y="' + (m.y + 5) + '" text-anchor="middle" font-size="12" fill="#fff">' + L.short + '</text>' +
      (opt.labels !== false ? '<text x="' + m.x + '" y="' + (m.y + 30) + '" text-anchor="middle" font-size="12" fill="var(--ink)" paint-order="stroke" stroke="var(--surface)" stroke-width="4">' + esc(m.label) + '</text>' : '') + '</g>';
    if (S.sel && S.sel.id === m.id && !opt.ro) s += '<rect class="sel" x="' + (m.x - 24) + '" y="' + (m.y - 20) + '" width="48" height="40"/>';
  });
  b.facilities.filter(x => x.floorId === fl.id).forEach(x => {
    const f = ft(x.type); const col = 'var(--g-' + f.group + ')'; const tc = f.group === 'alarm' ? '#000' : '#fff';
    s += '<g class="mk" data-kind="fac" data-id="' + x.id + '"><circle cx="' + x.x + '" cy="' + x.y + '" r="18" fill="' + col + '" stroke="var(--surface)" stroke-width="3"/><text x="' + x.x + '" y="' + (x.y + 4) + '" text-anchor="middle" font-size="' + (f.short.length > 2 ? 10 : 12) + '" fill="' + tc + '">' + esc(f.short) + '</text></g>';
    if (opt.hl === x.id) s += '<circle class="hl" cx="' + x.x + '" cy="' + x.y + '" r="30"/>';
    if (S.sel && S.sel.id === x.id && !opt.ro) s += '<circle class="sel" cx="' + x.x + '" cy="' + x.y + '" r="26"/>';
  });
  return s + '</svg>';
}

function readImg(file, max, cb) {
  const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const r = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * r); c.height = Math.round(im.height * r); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', .72)); }; im.onerror = () => toast('이미지를 읽지 못했습니다'); im.src = fr.result; }; fr.readAsDataURL(file);
}

  const over = e && e.type === 'pointerup' ? document.elementFromPoint(e.clientX, e.clientY) : null; const svg = over && over.closest('svg.plan');
  if (svg) addAt(p.tool, svgPt(svg, e)); else toast('개황도 안에 놓아야 추가됩니다');
}
document.addEventListener('pointerup', palEnd, true);
document.addEventListener('pointercancel', palEnd, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (S.lb || S.modal)) { if (S.lb) S.lb = null; else S.modal = null; render(); } });
function wrapTmp(html) { const d = document.createElement('div'); d.innerHTML = html; return d; }

  if (!drag) return; const svg = $('#plan'); if (!svg) return; const pt = svgPt(svg, e); const b = B(S.bId); const fl = b.floors.find(f => f.id === S.floorId);
  if (drag.room) { const r = drag.room; r.x = Math.min(drag.sx, snap(pt.x)); r.y = Math.min(drag.sy, snap(pt.y)); r.w = Math.max(10, Math.abs(snap(pt.x) - drag.sx)); r.h = Math.max(10, Math.abs(snap(pt.y) - drag.sy)); }
  else { drag.it.x = snap(pt.x - drag.ox); drag.it.y = snap(pt.y - drag.oy); drag.moved = true; }

});
document.addEventListener('pointerup', () => {
  if (!drag) return; const b = B(S.bId); const fl = b.floors.find(f => f.id === S.floorId);
  if (drag.room) { if (drag.room.w < 30 || drag.room.h < 30) fl.rooms = fl.rooms.filter(r => r !== drag.room); else { S.sel = { kind: 'room', id: drag.room.id }; touch(b); } drag = null; render(); const l = $('#sel-label'); if (l) l.select(); return; }
  if (drag.moved) { touch(b); }
  drag = null; render();
});

function onHash() {
  const h = location.hash.replace('#', '');

    S.qrToken = h.slice(2); const b = DB.buildings.find(x => x.token === S.qrToken);
